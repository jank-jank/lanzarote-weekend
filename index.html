<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2a36">
<title>Lanzarote Weekend: 7–8 Nov</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
  :root { --sat: #e4572e; --sun: #1a9bb0; --bg: #1f2a36; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #map { position: absolute; inset: 0; }
  .topbar { position: absolute; z-index: 1000; top: calc(env(safe-area-inset-top) + 10px); left: 50%; transform: translateX(-50%);
    display: flex; background: var(--bg); border-radius: 999px; padding: 4px; box-shadow: 0 2px 10px rgba(0,0,0,.3); }
  .topbar button { border: 0; background: transparent; color: #cfd8e3; font-weight: 600; font-size: 14px; padding: 8px 14px; border-radius: 999px; cursor: pointer; }
  .topbar button.on[data-day=sat] { background: var(--sat); color: #fff; }
  .topbar button.on[data-day=sun] { background: var(--sun); color: #fff; }
  .topbar button.on[data-day=both] { background: #fff; color: var(--bg); }
  .panel { position: absolute; z-index: 1000; left: 0; right: 0; bottom: 0; max-height: 46vh; background: #fff;
    border-radius: 16px 16px 0 0; box-shadow: 0 -4px 16px rgba(0,0,0,.2); display: flex; flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom); transition: max-height .25s; }
  .panel.min { max-height: 54px; }
  @media (min-width: 800px) {
    .panel, .panel.min { left: 12px; right: auto; top: 12px; bottom: 12px; width: 340px; max-height: none; border-radius: 16px; }
    .handle small { display: none; }
    .topbar { left: calc(50% + 176px); }
  }
  .handle { padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-weight: 700; color: var(--bg); }
  .handle small { font-weight: 500; color: #6b7785; }
  .list { overflow-y: auto; padding: 0 8px 8px; }
  .item { display: flex; gap: 10px; padding: 8px; border-radius: 10px; cursor: pointer; align-items: flex-start; }
  .item:hover, .item:focus { background: #f1f4f7; outline: none; }
  .num { flex: 0 0 26px; height: 26px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 13px; display: grid; place-items: center; }
  .item .t { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--bg); font-size: 13px; }
  .item .n { font-size: 14px; color: #222; }
  .item .d { font-size: 12px; color: #6b7785; }
  .leg { font-size: 11px; color: #8a96a3; padding: 0 8px 0 44px; }
  .day-h { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 10px 8px 4px; }
  .pin { width: 30px; height: 30px; border-radius: 50%; color: #fff; font-weight: 800; font-size: 14px; display: grid; place-items: center;
    border: 3px solid #fff; box-shadow: 0 1px 6px rgba(0,0,0,.45); }
  .pin.end { border-radius: 8px; }
  .leg-label { background: #fff; border-radius: 999px; padding: 2px 7px; font-size: 11px; font-weight: 700; white-space: nowrap;
    box-shadow: 0 1px 4px rgba(0,0,0,.3); color: var(--bg); }
  .pop h3 { margin: 0 0 2px; font-size: 15px; }
  .pop .meta { font-size: 12px; font-weight: 700; margin-bottom: 6px; }
  .pop p { margin: 4px 0; font-size: 13px; line-height: 1.4; }
  .pop .tip { background: #fff7e0; border-left: 3px solid #f0b400; padding: 6px 8px; border-radius: 4px; }
  .pop a.nav { display: inline-block; margin-top: 6px; background: var(--bg); color: #fff; text-decoration: none; padding: 7px 12px; border-radius: 8px; font-weight: 600; font-size: 13px; }
  .leaflet-popup-content { margin: 12px 14px; max-width: 290px; }
  .locate { background: #fff; width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer; font-size: 18px; }
  .me { width: 16px; height: 16px; background: #2b7bff; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 0 6px rgba(43,123,255,.25); }
</style>

<script>
const DATA = {"stops":{"sat":[{"id":"la_santa","time":"10:45","title":"Leave La Santa","desc":"Drive inland via Tinajo, Tiagua and Teguise, then up into Los Valles.","tip":"Fill up on fuel if needed. There are few stations in the north.","ll":[29.107732,-13.6656762]},{"id":"nieves","time":"11:25","dur":"15 min","title":"Ermita de las Nieves viewpoint","desc":"A chapel at about 600 m on top of the Risco de Famara cliffs, with the whole of Famara beach and La Graciosa below. It's free and empty. You'll be down on that beach this afternoon.","tip":"The last few hundred metres are a short stone lane. It's easy and fine for any car. It's windy and cool up there, so bring a layer.","ll":[29.1085683,-13.5265466]},{"id":"haria","time":"11:50","dur":"~1 h","title":"Har\u00eda: Saturday artisan market","desc":"Har\u00eda Artesanal runs Saturdays only, 10:00\u201314:30, in Plaza Le\u00f3n y Castillo under the laurel trees. About 60 stalls: palm-leaf baskets, island goat cheese, produce from local gardens, home baking. It's in the 'valley of a thousand palms'.","tip":"Have a coffee on the plaza. Optional: Manrique's last home, the Casa-Museo (\u20ac10, 10:30\u201317:30, about 45 min). It's quieter and more intimate than his big sites.","ll":[29.146973,-13.498231]},{"id":"mirador_rio","time":"13:10","dur":"40 min","title":"Mirador del R\u00edo","desc":"Manrique's viewpoint carved into the cliff, about 475 m above the strait and La Graciosa. \u20ac9, 10:00\u201317:00, last entry 16:40. This is one of the 'touristy' places that's genuinely worth it.","tip":"The approach is fully paved. Wind on the terrace can be strong.","ll":[29.2144204,-13.4813711]},{"id":"arrieta","time":"14:05","dur":"~1 h 10","title":"Fish lunch in Arrieta","desc":"A real fishing village on the northeast coast. El Charc\u00f3n sits right on the harbour (Sat 12\u201321, tel. 928 84 81 10). Amanecer is a local classic that takes no bookings. La Casa de la Playa is on La Garita beach (published hours vary, so call 928 17 33 39).","tip":"Order: catch of the day (cherne, vieja or sama), papas arrugadas with red and green mojo, lapas (grilled limpets), and a glass of Malvas\u00eda volc\u00e1nica (local white wine).","ll":[29.13181,-13.4618271]},{"id":"famara_power","time":"15:50","dur":"~2 h","title":"FAMARA: surf until sunset (18:04)","desc":"Famara Power, Calle El Islote 2, Caleta de Famara, open daily 10:00\u201320:00. Boards \u20ac20\u201330, wetsuit \u20ac8 (a 3/2 in November). Zoopark and Calima nearby rent at the same prices. Today's SE wind should be offshore here, which usually means clean waves.","tip":"Famara has strong currents. Ask the shop where to paddle out today and stay in the zone they suggest. Return boards by about 18:30, then have a beer in the sand streets of Caleta.","ll":[29.1181955,-13.566387]},{"id":"charco","time":"19:45","dur":"evening","title":"Arrecife: Charco de San Gin\u00e9s","desc":"The capital, and where islanders actually live. Walk Calle Real to the San Gin\u00e9s church, then go round the old fishermen's lagoon. The local way is one dish and one drink per bar, then move on. Try Tasca La Raspa (croquettes, local wine), Pap\u00e1 Miguel (cheap and cheerful fish bocadillo), La Chalana (open late), and La Mi\u00f1oca for a drink by the water (open till 2 am).","tip":"Order queso asado with mojo, grilled octopus, lapas and Malvas\u00eda. Locals start late; it gets busy from about 22:00. Tonight the EMEC electronic festival is on at Castillo de San Jos\u00e9 (15:00\u201300:00), so the city will be busy. Option: shower in La Santa first (Famara \u2192 La Santa 15 min, La Santa \u2192 Arrecife 25 min).","ll":[28.961123,-13.546301]},{"id":"bolas","time":"~22:00","dur":"15 min","walk":true,"title":"Puente de las Bolas, then home","desc":"A short walk from the Charco to the little bridge and the floodlit 16th-century Castillo de San Gabriel. A good last stop.","tip":"One of you is driving back to La Santa (about 25 min).","ll":[28.9561926,-13.5484143]}],"sun":[{"id":"la_santa","time":"10:05","title":"Hand back the keys and go","desc":"Drive the LZ-67 straight through the lava fields of the Parque Natural de los Volcanes.","tip":"Keep all luggage in the boot, out of sight, for the whole day.","ll":[29.107732,-13.6656762]},{"id":"timanfaya","time":"10:30","dur":"~1 h 45","title":"Timanfaya: Monta\u00f1as del Fuego","desc":"The 1730\u201336 eruptions: Manrique's 'Ruta de los Volcanes' coach route, geysers, and brushwood that catches fire from the heat of the ground. \u20ac30, 09:30\u201315:45. TICKETS ARE ONLINE ONLY with a time slot (cactlanzarote.com). Book a 10:45\u201311:00 slot and arrive 15 min early.","tip":"If it's sold out, drive the LZ-67 through the park (free) and stop at the free Mancha Blanca visitor centre (09:00\u201316:00).","ll":[29.0028258,-13.7506728]},{"id":"golfo","time":"12:40","dur":"~1 h 30","title":"El Golfo: fish lunch by the Atlantic","desc":"A row of fish restaurants with the ocean breaking just below. Costa Azul is the top pick on the Spanish site lanzarote3 (daily 10\u201322, tel. 928 173 199). Casa Torano (Restaurante El Golfo) is the oldest in the village. Note: Casa Rafa is closed on Sundays.","tip":"After lunch, walk 5\u201310 min to the viewpoint over the Charco de los Clicos green lagoon. The more local alternative is Teleclub Mancha Blanca, a village social club 5 min from Timanfaya (Sun 13\u201318, tel. 636 151 288).","ll":[28.9821862,-13.831356]},{"id":"janubio","time":"14:25","dur":"10 min","title":"Janubio salt flats viewpoint","desc":"A chequerboard of salt pans by a black-sand lagoon, right next to the LZ-701 on the way south. A quick stop.","tip":"Los Hervideros is NOT on the plan. The LZ-703 coast road has been closed to cars since a 2021 sinkhole, and the viewpoints are officially closed too.","ll":[28.9412883,-13.8170861]},{"id":"papagayo","time":"15:00","dur":"~1 h 10","title":"Papagayo beaches: swim","desc":"Golden coves in the Los Ajaches nature reserve. \u20ac3 per car, CARD ONLY. You drive about 5 km on a smooth, wide dirt road: slow, but fine for any car and anyone. Car parks are open 9\u201319. Playa Mujeres has the easiest access. Papagayo cove itself is the most photogenic.","tip":"There's no shade, so bring water. Leave by 16:10 at the latest.","ll":[28.8424181,-13.7881228]},{"id":"geria","time":"16:45","dur":"15 min","title":"La Geria wine valley (drive through)","desc":"Vines planted in black volcanic ash, each in its own pit behind a curved stone wall. Unique in the world. Bodega La Geria is open daily 9\u201319, so you have time for one glass of Malvas\u00eda if you're on schedule.","tip":"If you're running late, skip this and drive Playa Blanca \u2192 airport on the LZ-2 (about 35 min).","ll":[28.9693052,-13.7149384]},{"id":"airport","time":"17:15","title":"Airport: return the car by 17:30","desc":"Flight at 18:20.","tip":"Fill the tank before returning the car if your rental requires it.","ll":[28.952215,-13.606661]}]},"legs":{"sat":[{"from":"la_santa","to":"nieves","min":39,"km":31.7,"path":[[29.107697,-13.66593],[29.106761,-13.666044],[29.106453,-13.66664],[29.106429,-13.666701],[29.106147,-13.666799],[29.105469,-13.667028],[29.104938,-13.667194],[29.104696,-13.66726],[29.104363,-13.667316],[29.103744,-13.667336],[29.101621,-13.667033],[29.101009,-13.666975],[29.10046,-13.66702],[29.099757,-13.667192],[29.097936,-13.667733],[29.094805,-13.6684],[29.091974,-13.668997],[29.091246,-13.669149],[29.090503,-13.669376],[29.088768,-13.670153],[29.087605,-13.670698],[29.086527,-13.671187],[29.085774,-13.671421],[29.084267,-13.671554],[29.079843,-13.671845],[29.076037,-13.672092],[29.075172,-13.672146],[29.074142,-13.672189],[29.072413,-13.67223],[29.071081,-13.672268],[29.070862,-13.672336],[29.070579,-13.672719],[29.070202,-13.673244],[29.069785,-13.673855],[29.069477,-13.674275],[29.069346,-13.674398],[29.069143,-13.67455],[29.068351,-13.675116],[29.067862,-13.675488],[29.067389,-13.6759],[29.0673,-13.675989],[29.0 const COLORS = { sat: getComputedStyle(document.documentElement).getPropertyValue('--sat').trim(),

const DAYNAME = { sat: 'Saturday 7 Nov', sun: 'Sunday 8 Nov' };

const map = L.map('map', { zoomControl: false }).setView([29.05, -13.62], 10);
L.control.zoom({ position: 'topright' }).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {

const groups = { sat: L.featureGroup(), sun: L.featureGroup() };

map.on('zoomend', syncLabels);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

      el.onclick = el.onkeydown = e => {
        if (e.type === 'keydown' && e.key !== 'Enter') return;
        map.flyTo(s.ll, 13, { duration: .6 });
        map.once('moveend', () => markers[day][i].openPopup());
      };
      list.appendChild(el);
      const leg = DATA.legs[day][i];
      if (leg) {
        const l = document.createElement('div');
        l.className = 'leg'; l.textContent = `↓ ${leg.walk ? 'walk' : 'drive'} ${leg.min} min · ${leg.km} km`;
        list.appendChild(l);
      }
    });
  }
}

function show(mode) {
  document.querySelectorAll('.topbar button').forEach(b => b.classList.toggle('on', b.dataset.day === mode));
  const days = mode === 'both' ? ['sat', 'sun'] : [mode];
  for (const d of ['sat', 'sun']) days.includes(d) ? groups[d].addTo(map) : groups[d].remove();
  activeDays = days;
  const b = L.latLngBounds([]);
  days.forEach(d => b.extend(groups[d].getBounds()));
  map.fitBounds(b, wide()
    ? { paddingTopLeft: [370, 70], paddingBottomRight: [60, 20] }
    : { paddingTopLeft: [20, 70], paddingBottomRight: [20, panel.classList.contains('min') ? 70 : window.innerHeight * 0.46 + 10] });
  syncLabels();
  renderList(days);
  document.getElementById('ptitle').textContent = mode === 'both' ? 'Whole weekend' : DAYNAME[mode];
  history.replaceState(null, '', '#' + mode);
}
document.querySelectorAll('.topbar button').forEach(b => b.onclick = () => show(b.dataset.day));

const panel = document.getElementById('panel');
const wide = () => window.matchMedia('(min-width: 800px)').matches;
function setMin(min) {
  panel.classList.toggle('min', min);
  document.getElementById('ptoggle').textContent = min ? 'show ▴' : 'hide ▾';
}
document.getElementById('handle').onclick = () => setMin(!panel.classList.contains('min'));
map.on('popupopen', e => { if (!wide()) { setMin(true); setTimeout(() => e.popup._adjustPan && e.popup._adjustPan(), 300); } });

const Locate = L.Control.extend({ options: { position: 'topright' }, onAdd() {
  const d = L.DomUtil.create('div', 'leaflet-bar locate'); d.title = 'Show my location'; d.textContent = '◎';
  let me;
  d.onclick = () => navigator.geolocation && navigator.geolocation.watchPosition(p => {
    const ll = [p.coords.latitude, p.coords.longitude];
    if (!me) { me = L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [16, 16] }) }).addTo(map); map.setView(ll, 13); }
    else me.setLatLng(ll);
  }, () => alert('Location unavailable'), { enableHighAccuracy: true });
  return d;
}});
new Locate().addTo(map);

const hash = location.hash.slice(1);
const now = new Date();
show(['sat', 'sun', 'both'].includes(hash) ? hash : (now.getDay() === 0 ? 'sun' : 'sat'));
</script>
</body>
