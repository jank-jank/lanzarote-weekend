<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Lanzarote Weekend: 7–8 Nov</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
  :root { --sat: #e4572e; --sun: #1a9bb0; --bg: #1f2a36; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #map { position: absolute; inset: 0; }
  .topbar { position: absolute; z-index: 1000; top: calc(env(safe-area-inset-top) + 10px); left: 50%; transform: translateX(-50%);
    display: flex; background: var(--bg); border-radius: 999px; padding: 4px; box-shadow: 0 2px 10px rgba(0,0,0,.3); }
  .topbar button { border: 0; background: transparent; color: #cfd8e3; font-weight: 600; font-size: 14px; padding: 8px 14px; border-radius: 999px; cursor: pointer; }
  .topbar button.on[data-day=sat] { background: var(--sat); color: #fff; }
  .topbar button.on[data-day=sun] { background: var(--sun); color: #fff; }
  .topbar button.on[data-day=both] { background: #fff; color: var(--bg); }
  .panel { position: absolute; z-index: 1000; left: 0; right: 0; bottom: 0; max-height: 46vh; background: #fff;
    border-radius: 16px 16px 0 0; box-shadow: 0 -4px 16px rgba(0,0,0,.2); display: flex; flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom); transition: max-height .25s; }
  .panel.min { max-height: 54px; }
  @media (min-width: 800px) {
    .panel, .panel.min { left: 12px; right: auto; top: 12px; bottom: 12px; width: 340px; max-height: none; border-radius: 16px; }
    .handle small { display: none; }
    .topbar { left: calc(50% + 176px); }
  }
  .handle { padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-weight: 700; color: var(--bg); }
  .handle small { font-weight: 500; color: #6b7785; }
  .list { overflow-y: auto; padding: 0 8px 8px; }
  .item { display: flex; gap: 10px; padding: 8px; border-radius: 10px; cursor: pointer; align-items: flex-start; }
  .item:hover, .item:focus { background: #f1f4f7; outline: none; }
  .num { flex: 0 0 26px; height: 26px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 13px; display: grid; place-items: center; }
  .item .t { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--bg); font-size: 13px; }
  .item .n { font-size: 14px; color: #222; }
  .item .d { font-size: 12px; color: #6b7785; }
  .leg { font-size: 11px; color: #8a96a3; padding: 0 8px 0 44px; }
  .note { margin: 4px 8px 8px; padding: 8px 10px; background: #f4f8fa; border-left: 3px solid; border-radius: 6px; font-size: 12.5px; line-height: 1.45; color: #33404d; }
  .day-h { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 10px 8px 4px; }
  .pin { width: 30px; height: 30px; border-radius: 50%; color: #fff; font-weight: 800; font-size: 14px; display: grid; place-items: center;
    border: 3px solid #fff; box-shadow: 0 1px 6px rgba(0,0,0,.45); }
  .pin.end { border-radius: 8px; }
  .leg-label { background: #fff; border-radius: 999px; padding: 2px 7px; font-size: 11px; font-weight: 700; white-space: nowrap;
    box-shadow: 0 1px 4px rgba(0,0,0,.3); color: var(--bg); }
  .pop h3 { margin: 0 0 2px; font-size: 15px; }
  .pop .meta { font-size: 12px; font-weight: 700; margin-bottom: 6px; }
  .pop p { margin: 4px 0; font-size: 13px; line-height: 1.4; }
  .pop .tip { background: #fff7e0; border-left: 3px solid #f0b400; padding: 6px 8px; border-radius: 4px; }
  .pop a.nav { display: inline-block; margin-top: 6px; background: var(--bg); color: #fff; text-decoration: none; padding: 7px 12px; border-radius: 8px; font-weight: 600; font-size: 13px; }
  .leaflet-popup-content { margin: 12px 14px; max-width: 290px; }
  .locate { background: #fff; width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer; font-size: 18px; }
  .me { width: 16px; height: 16px; background: #2b7bff; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 0 6px rgba(43,123,255,.25); }
</style>

<script>
const DATA = {"stops":{"sat":[{"id":"la_santa","time":"10:45","title":"Leave La Santa","desc":"Drive inland via Tinajo, Tiagua and Teguise, then up into Los Valles.","tip":"Fill up on fuel if needed. There are few stations in the north.","ll":[29.107732,-13.6656762]},{"id":"nieves","time":"11:25","dur":"15 min","title":"Ermita de las Nieves viewpoint","desc":"A chapel at about 600 m on top of the Risco de Famara cliffs, with the whole of Famara beach and La Graciosa below. It's free and empty. You'll be down on that beach this afternoon.","tip":"The last few hundred metres are a short stone lane. It's easy and fine for any car. It's windy and cool up there, so bring a layer.","ll":[29.1085683,-13.5265466]},{"id":"haria","time":"11:50","dur":"~1 h","title":"Har\u00eda: Saturday artisan market","desc":"Har\u00eda Artesanal runs Saturdays only, 10:00\u201314:30, in Plaza Le\u00f3n y Castillo under the laurel trees. About 60 stalls: palm-leaf baskets, island goat cheese, produce from local gardens, home baking. It's in the 'valley of a thousand palms'.","tip":"Have a coffee on the plaza. Optional: Manrique's last home, the Casa-Museo (\u20ac10, 10:30\u201317:30, about 45 min). It's quieter and more intimate than his big sites.","ll":[29.146973,-13.498231]},{"id":"mirador_rio","time":"13:10","dur":"40 min","title":"Mirador del R\u00edo","desc":"Manrique's viewpoint carved into the cliff, about 475 m above the strait and La Graciosa. \u20ac9, 10:00\u201317:00, last entry 16:40. This is one of the 'touristy' places that's genuinely worth it.","tip":"The approach is fully paved. Wind on the terrace can be strong.","ll":[29.2144204,-13.4813711]},{"id":"arrieta","time":"14:05","dur":"~1 h 10","title":"Fish lunch in Arrieta","desc":"A real fishing village on the northeast coast. El Charc\u00f3n sits right on the harbour (Sat 12\u201321, tel. 928 84 81 10). Amanecer is a local classic that takes no bookings. La Casa de la Playa is on La Garita beach (published hours vary, so call 928 17 33 39).","tip":"Order: catch of the day (cherne, vieja or sama), papas arrugadas with red and green mojo, lapas (grilled limpets), and a glass of Malvas\u00eda volc\u00e1nica (local white wine).","ll":[29.13181,-13.4618271]},{"id":"famara_power","time":"15:50","dur":"~2 h","title":"FAMARA: surf until sunset (18:04)","desc":"Famara Power, Calle El Islote 2, Caleta de Famara, open daily 10:00\u201320:00. Boards \u20ac20\u201330, wetsuit \u20ac8 (a 3/2 in November). Zoopark and Calima nearby rent at the same prices. Today's SE wind should be offshore here, which usually means clean waves.","tip":"Famara has strong currents. Ask the shop where to paddle out today and stay in the zone they suggest. Return boards by about 18:30, then have a beer in the sand streets of Caleta.","ll":[29.1181955,-13.566387]},{"id":"charco","time":"19:45","dur":"evening","title":"Arrecife: Charco de San Gin\u00e9s","desc":"The capital, and where islanders actually live. Walk Calle Real to the San Gin\u00e9s church, then go round the old fishermen's lagoon. The local way is one dish and one drink per bar, then move on. Try Tasca La Raspa (croquettes, local wine), Pap\u00e1 Miguel (cheap and cheerful fish bocadillo), La Chalana (open late), and La Mi\u00f1oca for a drink by the water (open till 2 am).","tip":"Order queso asado with mojo, grilled octopus, lapas and Malvas\u00eda. Locals start late; it gets busy from about 22:00. Tonight the EMEC electronic festival is on at Castillo de San Jos\u00e9 (15:00\u201300:00), so the city will be busy. Option: shower in La Santa first (Famara \u2192 La Santa 15 min, La Santa \u2192 Arrecife 25 min).","ll":[28.961123,-13.546301]},{"id":"bolas","time":"~22:00","dur":"15 min","walk":true,"title":"Puente de las Bolas, then home","desc":"A short walk from the Charco to the little bridge and the floodlit 16th-century Castillo de San Gabriel. A good last stop.","tip":"One of you is driving back to La Santa (about 25 min).","ll":[28.9561926,-13.5484143]}],"sun":[{"id":"la_santa","time":"10:05","title":"Hand back the keys and go","desc":"Head south via Mancha Blanca onto the LZ-56, the Tinguat\u00f3n road through the Parque Natural de los Volcanes. Today is a volcano day: the 1730\u201336 eruptions here buried around 20 villages.","tip":"Long trousers or closed shoes are useful for the volcano walks. Keep luggage in the boot, out of sight.","ll":[29.107732,-13.6656762]},{"id":"cuervo","time":"10:20","dur":"~1 h 10","title":"Walk INTO a volcano: Caldera de los Cuervos","desc":"The first volcano of the 1730 Timanfaya eruption, the one that destroyed the village of Chimanfaya. A flat 20-minute gravel path across the lava field takes you to the cone. A collapsed side lets you walk straight onto the crater floor, between vertical walls of red and black rock. It's free and needs no ticket. Tinajo council rates it easy and suitable for everyone, so it's fine for her dad.","tip":"The car park only fits about 30 cars and fills by about 10:30 at weekends, which is why this comes first. There's a deep ridge at the car park entrance, so drive over it slowly. There's no shade, so bring water.","ll":[28.99668,-13.6846]},{"id":"colorada","time":"11:35","dur":"~35 min","title":"Monta\u00f1a Colorada: the giant volcanic bomb","desc":"500 m further on is the last volcano of the eruption (April 1736): a rust-red cone. Next to it is a 2-metre volcanic bomb, a blob of lava thrown out of the crater that landed already solid. Lanzarote3 puts it on the podium of the island's most beautiful volcanoes.","tip":"Short version: walk the loop anticlockwise to the bomb (about 650 m) and back. Climbing the cone or touching the bombs is prohibited.","ll":[29.00469,-13.68381]},{"id":"echadero","time":"12:30","dur":"~25 min","title":"Through Timanfaya + camel ride","desc":"The leg here drives through the national park itself on the LZ-67: the same lava sea the \u20ac30 coach tour shows you. You can't stop inside the park, so drive slowly. At the Echadero you ride a dromedary up the ash slope of Monta\u00f1a de Timanfaya: \u20ac11 per person, about 20 min, no booking, card or cash, daily 9:30\u201315:00 (last ride about 14:30).","tip":"Honest note: it's short and touristy, and some animal-welfare groups criticise it. If that's a turn-off, skip it and use the 25 min for a longer Colorada loop. The ride is run by the Yaiza council and supports about 40 camel-handler families from Uga.","ll":[28.99168,-13.74219]},{"id":"stratvs","time":"13:15","dur":"~2 h 15","title":"La Geria I: Stratvs tour, tasting + lunch","desc":"A winery in the Barranco del Obispo, next to Timanfaya, built around a Canarian house from 1730. The 13:30 guided tour 'En torno al vino' takes about 60 min through the ash-pit vineyards and cellar, ending with 3 wines and Finca de Uga goat cheeses. \u20ac25. BOOK ONLINE NOW at stratvs.com (tel. 928 809 977). Afterwards, have lunch in their restaurant (12:30\u201318:00).","tip":"Ask to try the Malvas\u00eda Volc\u00e1nica (dry white) and the semi-sweet Moscatel. If 13:30 is full: Bodegas Rubic\u00f3n's 13:30 guided tour (\u20ac22, needs at least 6 people, tel. 928 173 708), or just do the free walk-in at Rubic\u00f3n.","ll":[28.97406,-13.70548]},{"id":"rubicon","time":"15:35","dur":"~50 min","title":"La Geria II: Bodegas Rubic\u00f3n","desc":"A farm estate founded in 1570. Entry is free and you can wander on your own (daily 10\u201319): the old manor house, the original cellar, the vines in their black-ash pits, and a terrace under 100-year-old eucalyptus trees looking at Timanfaya. Taste a glass or two in the wine shop, no booking needed.","tip":"The driver should take it easy: it's the second winery of the day. Buy a bottle to take home; the shop packs it for flights.","ll":[28.96875,-13.71396]},{"id":"airport","time":"16:50","title":"Airport: return the car by 17:30","desc":"The route north on the LZ-30 goes through the heart of La Geria (Masdache), the best stretch of the valley, about 16 min. Flight at 18:20.","tip":"You have about 40 min of buffer for fuel and the rental check-in.","ll":[28.952215,-13.606661]}]},"legs":{"sat":[{"from":"la_santa","to":"nieves","min":39,"km":31.7,"path":[[29.107697,-13.66593],[29.106761,-13.666044],[29.106453,-13.66664],[29.106429,-13.666701],[29.106147,-13.666799],[29.105469,-13.667028],[29.104938,-13.667194],[29.104696,-13.66726],[29.104363,-13.667316],[29.103744,-13.667336],[29.101621,-13.667033],[29.101009,-13.666975],[29.10046,-13.66702],[29.099757,-13.667192],[29.097936,-13.667733],[29.094805,-13.6684],[29.091974,-13.668997],[29.091246,-13.669149],[29.090503,-13.669376],[29.088768,-13.670153],[29.087605,-13.670698],[29.086527,-13.671187],[29.085774,-13.671421],[29.084267,-13.671554],[29.079843,-13.671845],[29.076037,-13.672092],[29.075172,-13.672146],[29.074142,-13.672189],[29.072413,-13.67223],[29.071081,-13.672268],[29.070862,-13.672336],[29.070579,-13.672719],[29.070202,-13.673244],[29.069785,-13.673855],[29.069477,-13.674275],[29.069346,-13.674398],[29.069143,-13.67455],[29.068351,-13.675116],[29.067862,-13.675488],[29.067389,-13.6759],[29.0673,-13.675989],[29.066992,-13.676205],[29.066963,-13.676231],[29.066887,-13.676234],[29.066834,-13.676172],[29.06683,-13.676111],[29.066804,-13.6759],[29.066721,-13.675601],[29.066354,-13.674655],[29.066235,-13.674328],[29.065231,-13.671788],[29.064696,-13.670398],[29.063873,-13.668229],[29.062151,-13.663716],[29.061588,-13.662239],[29.059115,-13.655726],[29.057473,-13.651413],[29.056724,-13.649439],[29.05624,-13.647987],[29.054438,-13.637644],[29.054144,-13.635958],[29.053968,-13.63491],[29.053803,-13.633941],[29.05376,-13.633558],[29.053654,-13.63327],[29.05356,-13.63305],[29.053496,-13.632871],[29.053363,-13.632079],[29.05335,-13.631919],[29.053361,-13.631721],[29.053398,-13.631474],[29.053552,-13.630821],[29.053581,-13.630614],[29.053577,-13.63043],[29.053526,-13.630246],[29.053431,-13.63002],[29.052905,-13.629217],[29.052125,-13.628345],[29.051501,-13.627666],[29.05086 const COLORS = { sat: getComputedStyle(document.documentElement).getPropertyValue('--sat').trim(),

const DAYNAME = { sat: 'Saturday 7 Nov', sun: 'Sunday 8 Nov' };

const map = L.map('map', { zoomControl: false }).setView([29.05, -13.62], 10);
L.control.zoom({ position: 'topright' }).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const groups = { sat: L.featureGroup(), sun: L.featureGroup() };
const markers = { sat: [], sun: [] };
const labels = { sat: L.layerGroup(), sun: L.layerGroup() };
let activeDays = [];
function syncLabels() {
  for (const d of ['sat', 'sun']) (activeDays.includes(d) && map.getZoom() >= 11) ? labels[d].addTo(map) : labels[d].remove();
}
map.on('zoomend', syncLabels);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

for (const day of ['sat', 'sun']) {

      html: `<div class="leg-label" style="transform:translate(-50%,-50%)">${leg.walk ? 'walk ' : ''}${leg.min} min</div>` }) }).addTo(labels[day]);
  }
  const stops = DATA.stops[day];
  const lastIdx = stops.length - 1;
  stops.forEach((s, i) => {

      .bindPopup(html, { autoPanPaddingTopLeft: [10, 60], autoPanPaddingBottomRight: [10, 70] })
      .addTo(groups[day]);

    if (days.length > 1) {
      const h = document.createElement('div');
      h.className = 'day-h'; h.style.color = COLORS[day]; h.textContent = DAYNAME[day];
      list.appendChild(h);
    }
    if (DATA.notes && DATA.notes[day]) {
      const n = document.createElement('div');
      n.className = 'note'; n.style.borderColor = COLORS[day];
      n.innerHTML = esc(DATA.notes[day]).replace(/(PLAN [BC][^:]*:)/g, '<br><br><b>$1</b>');
      list.appendChild(n);
    }
    DATA.stops[day].forEach((s, i) => {
      const el = document.createElement('div');
      el.className = 'item'; el.tabIndex = 0;
      el.innerHTML = `<div class="num" style="background:${COLORS[day]}">${i + 1}</div>
        <div><div class="t">${esc(s.time)}${s.dur ? ' <span class="d">· ' + esc(s.dur) + '</span>' : ''}</div>
        <div class="n">${esc(s.title)}</div></div>`;
      el.onclick = el.onkeydown = e => {
        if (e.type === 'keydown' && e.key !== 'Enter') return;
        map.flyTo(s.ll, 13, { duration: .6 });
        map.once('moveend', () => markers[day][i].openPopup());
      };
      list.appendChild(el);
      const leg = DATA.legs[day][i];
      if (leg) {
        const l = document.createElement('div');
        l.className = 'leg'; l.textContent = `↓ ${leg.walk ? 'walk' : 'drive'} ${leg.min} min · ${leg.km} km`;
        list.appendChild(l);
      }
    });
  }
}

function show(mode) {
  document.querySelectorAll('.topbar button').forEach(b => b.classList.toggle('on', b.dataset.day === mode));
  const days = mode === 'both' ? ['sat', 'sun'] : [mode];
  for (const d of ['sat', 'sun']) days.includes(d) ? groups[d].addTo(map) : groups[d].remove();
  activeDays = days;
  const b = L.latLngBounds([]);
  days.forEach(d => b.extend(groups[d].getBounds()));
  map.fitBounds(b, wide()
    ? { paddingTopLeft: [370, 70], paddingBottomRight: [60, 20] }
    : { paddingTopLeft: [20, 70], paddingBottomRight: [20, panel.classList.contains('min') ? 70 : window.innerHeight * 0.46 + 10] });
  syncLabels();
  renderList(days);
  document.getElementById('ptitle').textContent = mode === 'both' ? 'Whole weekend' : DAYNAME[mode];
  history.replaceState(null, '', '#' + mode);
}
document.querySelectorAll('.topbar button').forEach(b => b.onclick = () => show(b.dataset.day));

const panel = document.getElementById('panel');
const wide = () => window.matchMedia('(min-width: 800px)').matches;
function setMin(min) {
  panel.classList.toggle('min', min);
  document.getElementById('ptoggle').textContent = min ? 'show ▴' : 'hide ▾';
}
document.getElementById('handle').onclick = () => setMin(!panel.classList.contains('min'));
map.on('popupopen', e => { if (!wide()) { setMin(true); setTimeout(() => e.popup._adjustPan && e.popup._adjustPan(), 300); } });

const Locate = L.Control.extend({ options: { position: 'topright' }, onAdd() {
  const d = L.DomUtil.create('div', 'leaflet-bar locate'); d.title = 'Show my location'; d.textContent = '◎';
  let me;
  d.onclick = () => navigator.geolocation && navigator.geolocation.watchPosition(p => {
    const ll = [p.coords.latitude, p.coords.longitude];
    if (!me) { me = L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [16, 16] }) }).addTo(map); map.setView(ll, 13); }
    else me.setLatLng(ll);
  }, () => alert('Location unavailable'), { enableHighAccuracy: true });
  return d;
}});
new Locate().addTo(map);

const hash = location.hash.slice(1);
const now = new Date();
show(['sat', 'sun', 'both'].includes(hash) ? hash : (now.getDay() === 0 ? 'sun' : 'sat'));
</script>
